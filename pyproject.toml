[project]
name = "hartreez"
version = "0.1.0"
description = "Dependency-free atomistic unit conversion for numerical Python code"
readme = "README.md"
authors = [
    { name = "Thomas Plé", email = "thomas.ple@sorbonne-universite.fr" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pydantic>=2.13.5",
]

[project.scripts]
hartreez = "hartreez:main"

[project.optional-dependencies]
pydantic = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
