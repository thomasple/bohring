name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }} (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [pytest, pyright]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install locked development dependencies
        run: uv sync --locked --dev

      - name: Run ${{ matrix.check }}
        run: uv run --no-sync ${{ matrix.check }}
